<section #sectorsSection class="sectors-section" aria-label="القطاعات التي نخدمها">
  <div class="container sectors-container">

    <!-- Editorial Header -->
    <header class="sectors-header">
      <div class="header-titles">
        <span class="sectors-kicker">نطاق العلامة والعمل</span>
        <h2 class="sectors-title">القطاعات التي نخدمها</h2>
      </div>
      <!-- Subtle Brand Architectural Detail (Identity Geometry) -->
      <div class="brand-structural-marker" aria-hidden="true">
        <span class="marker-axis"></span>
        <span class="marker-coord">فهرس ٠٧</span>
      </div>
    </header>

    <!-- Unified Editorial Sector Matrix -->
    <div class="sector-matrix">
      
      <!-- 01: Featured Lead Sector -->
      <div class="matrix-item item-hero" tabindex="0">
        <div class="item-inner">
          <span class="item-num">01</span>
          <h3 class="item-title">الجهات الحكومية والوزارات</h3>
          <span class="item-cue" aria-hidden="true" title="الجهات الحكومية">
            <i class="fa-solid fa-landmark"></i>
          </span>
        </div>
        <span class="hero-gold-accent" aria-hidden="true"></span>
        <span class="item-hairline" aria-hidden="true"></span>
      </div>

      <!-- 02: Private Sector & Corporations -->
      <div class="matrix-item item-regular item-02" tabindex="0">
        <div class="item-inner">
          <span class="item-num">02</span>
          <h3 class="item-title">الشركات والقطاع الخاص</h3>
          <span class="item-cue" aria-hidden="true" title="القطاع الخاص">
            <i class="fa-solid fa-building"></i>
          </span>
        </div>
        <span class="item-hairline" aria-hidden="true"></span>
      </div>

      <!-- 03: Major Seasons & Festivals -->
      <div class="matrix-item item-regular item-03" tabindex="0">
        <div class="item-inner">
          <span class="item-num">03</span>
          <h3 class="item-title">المواسم والمهرجانات الكبرى</h3>
          <span class="item-cue" aria-hidden="true" title="المواسم والمهرجانات">
            <i class="fa-solid fa-masks-theater"></i>
          </span>
        </div>
        <span class="item-hairline" aria-hidden="true"></span>
      </div>

      <!-- 04: Expos & Conferences -->
      <div class="matrix-item item-regular item-04" tabindex="0">
        <div class="item-inner">
          <span class="item-num">04</span>
          <h3 class="item-title">المعارض والمؤتمرات</h3>
          <span class="item-cue" aria-hidden="true" title="المعارض والمؤتمرات">
            <i class="fa-solid fa-handshake"></i>
          </span>
        </div>
        <span class="item-hairline" aria-hidden="true"></span>
      </div>

      <!-- 05: Tourism Hubs & Destinations -->
      <div class="matrix-item item-regular item-05" tabindex="0">
        <div class="item-inner">
          <span class="item-num">05</span>
          <h3 class="item-title">المراكز والوجهات السياحية</h3>
          <span class="item-cue" aria-hidden="true" title="الوجهات السياحية">
            <i class="fa-solid fa-compass"></i>
          </span>
        </div>
        <span class="item-hairline" aria-hidden="true"></span>
      </div>

      <!-- 06: Universities & Educational Entities -->
      <div class="matrix-item item-regular item-06" tabindex="0">
        <div class="item-inner">
          <span class="item-num">06</span>
          <h3 class="item-title">الجامعات والجهات التعليمية</h3>
          <span class="item-cue" aria-hidden="true" title="الجهات التعليمية">
            <i class="fa-solid fa-graduation-cap"></i>
          </span>
        </div>
        <span class="item-hairline" aria-hidden="true"></span>
      </div>

      <!-- 07: National Celebrations -->
      <div class="matrix-item item-regular item-07" tabindex="0">
        <div class="item-inner">
          <span class="item-num">07</span>
          <h3 class="item-title">الاحتفالات الوطنية</h3>
          <span class="item-cue" aria-hidden="true" title="الاحتفالات الوطنية">
            <i class="fa-solid fa-flag"></i>
          </span>
        </div>
        <span class="item-hairline" aria-hidden="true"></span>
      </div>

    </div>

  </div>
</section>
