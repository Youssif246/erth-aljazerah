<section #heroContainer class="hero-cinematic-stage">
  <!-- Immersive Full-Viewport Photographic Canvas -->
  <div class="hero-canvas-viewport">
    <img
      #heroImage
      src="/hero.png"
      alt="إرث الجزيرة - المشهد التراثي والفروسية والهجانة في الجزيرة العربية"
      class="hero-cinematic-img"
      fetchpriority="high"
      decoding="async"
    />

    <!-- Full-Viewport Cinematic Color Grading Overlay (100% Coverage) -->
    <div #heroOverlay class="hero-cinematic-overlay"></div>
  </div>

  <!-- Optically Centered Editorial Composition -->
  <div class="hero-content-stage">
    <div class="hero-centerpiece">
      <!-- 1. Editorial Eyebrow (Refined Ochre Accent, No Box/Pill) -->
      <div class="hero-eyebrow">
        <span class="eyebrow-text">نحوّل التراث إلى تجربة تُعاش</span>
      </div>

      <!-- 2. Main Headline (Two Intentional Lines with pristine diacritics & dots) -->
      <h1 class="hero-main-title">
        <span class="headline-mask"><span class="headline-line">نُحيي الإرث ليبقى حيًا في الذاكرة،</span></span>
        <span class="headline-mask"><span class="headline-line">وتُروى أصالته في كل تجربة</span></span>
      </h1>

      <!-- 3. Short Supporting Copy (Smaller, comfortable, muted context) -->
      <p class="hero-supporting-copy">
        نصنع الفعاليات الوطنية والتجارب الحية برؤية تُجسّد عمق الحكاية وأصالة المشهد.
      </p>

      <!-- 4. Single Architectural CTA -->
      <div class="hero-cta-wrapper">
        <a routerLink="/services" class="hero-cta-btn">
          <span class="cta-label">استكشف خدماتنا</span>
          <i class="fa-solid fa-arrow-left cta-arrow" aria-hidden="true"></i>
        </a>
      </div>
    </div>

    <!-- 5. Minimal Architectural Scroll Indicator -->
    <div class="hero-scroll-cue" aria-hidden="true">
      <div class="scroll-line-track">
        <span class="scroll-tracer"></span>
      </div>
      <span class="scroll-caption">استكشف الحكاية</span>
    </div>
  </div>
</section>
